<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="recall-icon-g" x1="16" y1="10" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D11FB5" />
      <stop offset="1" stop-color="#8A1C84" />
    </linearGradient>
  </defs>
  <!-- bucle de recall: arco de ~300° que se cierra sobre el punto central -->
  <path d="M41 16.41 A18 18 0 1 1 23 16.41" stroke="url(#recall-icon-g)" stroke-width="6" stroke-linecap="round" />
  <!-- punta de flecha apuntando de vuelta al bucle -->
  <path d="M30.79 11.91 L24.7 22.36 L18.7 11.96 Z" fill="url(#recall-icon-g)" />
  <!-- punto de memoria -->
  <circle cx="32" cy="32" r="5.5" fill="url(#recall-icon-g)" />
</svg>
